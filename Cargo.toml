[package]
name = "cawir"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio-tungstenite = "0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dotenvy = "0.15.7"
directories = "6.0.0"
base64 = "0.22.1"
rpassword = "7.5.2"
clap = { version = "4.5.38", features = ["derive"] }
uuid = { version = "1.16.0", features = ["v4"] }
ratatui = "0.29"
crossterm = "0.28"
ratatui-textarea = { version = "0.9.1", default-features = false }
