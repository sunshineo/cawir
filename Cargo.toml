[package]
name = "cawir"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dotenvy = "0.15.7"
directories = "6.0.0"
base64 = "0.22.1"
rpassword = "7.5.2"
clap = { version = "4.5.38", features = ["derive"] }
uuid = { version = "1.16.0", features = ["v4"] }
